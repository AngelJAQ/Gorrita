<div class="modelo-screen">
<section class="modelo">
  <div class="wrapper">
    <mat-drawer-container>
      <mat-drawer #drawer mode="over" position="start">
        <app-left-sidebar (cerrar)="drawer.toggle()"></app-left-sidebar>
      </mat-drawer>

      <app-header-app (drawer)="drawer.toggle()"></app-header-app>

      <div class="body-modelo">
        <h1 class="title-modelo">Modelo Predictivo</h1>
        <p class="description-modelo">
          Desarrollar un modelo que permita predecir el rendimiento del cultivo de cebada y convertirlo en una solución tecnológica funcional.
        </p>
        <img src="assets/img/convocatoria-2026-que-es.jpg" class="logo-modelo">
      </div>
      <br>
      <app-footer-app></app-footer-app>
    </mat-drawer-container>
  </div>
</section>
</div>
